<footer class="fm-band">
<dl class="fm-colophon">
<dt>How to cite</dt><dd>Citation</dd>
<dt>Source</dt><dd>Source</dd>
<dt>Licence</dt><dd>Licence</dd>
</dl>
</footer>
<script>
// The colophon sits on RSM's text column, wherever RSM puts it at this width. The column is
// the content zone of a block directly in a section (RSM puts the whole page in one): a block
// nested in another is narrower, and a hidden or folded one has no width.
(() => {
  const align = () => {
    const col = [...document.querySelectorAll(".manuscriptwrapper section > .hr > .hr-content-zone")]
      .find((z) => z.getBoundingClientRect().width > 0);
    if (!col) return;
    const r = col.getBoundingClientRect();
    for (const el of document.querySelectorAll(".fm-colophon")) {
      el.style.marginLeft = `${r.left}px`;
      el.style.width = `${r.width}px`;
    }
  };
  addEventListener("load", align);
  addEventListener("resize", align);
  // RSM moves its column after load too: when the sidebar opens or the margin column turns on,
  // or the reader changes the reading width.
  document.addEventListener("rsm:margin-layout", align);
  new MutationObserver(align).observe(document.documentElement, { attributes: true });
  addEventListener("DOMContentLoaded", () => {
    const wrapper = document.querySelector(".manuscriptwrapper");
    if (wrapper) new ResizeObserver(align).observe(wrapper);
  });
  align();
})();
</script>
</body>
